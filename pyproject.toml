[project]
name = "imcluster"
version = "0.2.0"
description = "Cluster images using features from pretrained vision models."
readme = "README.rst"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" },
]
keywords = ["clustering", "computer-vision", "dinov3", "images", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=10",
    "pyarrow>=10",
    "rich>=12",
    "scikit-learn>=1.2",
    "torch>=2.13.0",
    "transformers>=4.56,<5",
    "typer>=0.12",
]

[project.urls]
Documentation = "https://rbturnbull.github.io/imcluster/"
Issues = "https://github.com/rbturnbull/imcluster/issues"
Repository = "https://github.com/rbturnbull/imcluster"

[project.scripts]
imcluster = "imcluster.main:app"

[tool.poetry.group.dev.dependencies]
build = ">=1.2"
coverage = ">=7.6"
mypy = ">=1.11"
pandas-stubs = ">=2.2"
pytest = ">=8"
pytest-cov = ">=5"
ruff = ">=0.9"
sphinx = ">=7"
sphinx-rtd-theme = ">=2"
sphinxcontrib-bibtex = ">=2.6"
twine = ">=5"

[tool.pytest.ini_options]
addopts = "--cov=imcluster --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["imcluster"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
packages = ["imcluster"]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
