[project]
name = "imcluster"
version = "0.4.0"
description = "Cluster and explore image collections with an interactive gallery."
readme = "README.rst"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Robert Turnbull", email = "robert.turnbull@unimelb.edu.au" },
]
keywords = ["clustering", "computer-vision", "dinov3", "dinov2", "images", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "jinja2>=3.1",
    "huggingface-hub>=0.34,<2",
    "numba>=0.61",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=10",
    "pyarrow>=10",
    "rich>=12",
    "scikit-learn>=1.3",
    "scipy>=1.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.56,<5",
    "typer>=0.12",
    "umap-learn>=0.5",
    "llmloader (>=0.1.9,<0.2.0)",
]

[project.urls]
Documentation = "https://rbturnbull.github.io/imcluster/"
Issues = "https://github.com/rbturnbull/imcluster/issues"
Repository = "https://github.com/rbturnbull/imcluster"

[project.scripts]
imcluster = "imcluster.main:app"

[tool.poetry.group.dev.dependencies]
build = ">=1.2"
coverage = ">=7.6"
mypy = ">=1.11"
pandas-stubs = ">=2.2"
pytest = ">=8"
ruff = ">=0.9"
sphinx = ">=7"
sphinx-rtd-theme = ">=2"
sphinxcontrib-bibtex = ">=2.6"
twine = ">=5"

[tool.poetry]
exclude = ["imcluster/llm-bk.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["typings"]
packages = ["imcluster"]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
