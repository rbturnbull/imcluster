name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install poetry
      - run: poetry install
      - run: poetry run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install poetry
      - run: poetry install
      - run: poetry run coverage run -m pytest
      - run: poetry run coverage report --fail-under=80
      - run: poetry run ruff check imcluster tests
      - run: poetry run ruff format --check imcluster tests
      - run: poetry run mypy imcluster
      - run: poetry run sphinx-build -W -b html docs docs/_build/html
      - run: poetry build
      - run: poetry run twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/imcluster-wheel
          /tmp/imcluster-wheel/bin/pip install dist/*.whl
          /tmp/imcluster-wheel/bin/imcluster --help
