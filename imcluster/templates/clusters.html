<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>imcluster report</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 96rem; padding: 2rem; }
      h1 { margin-bottom: .5rem; }
      .metadata { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin-bottom: 2rem; }
      .metadata span { white-space: nowrap; }
      details { border-top: 1px solid #8886; padding: 1rem 0; }
      summary { cursor: pointer; font-size: 1.25rem; font-weight: 650; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); margin-top: 1rem; }
      figure { margin: 0; min-width: 0; }
      img { background: #8882; border-radius: .35rem; display: block; height: 12rem; object-fit: contain; width: 100%; }
      figcaption { font-size: .85rem; overflow-wrap: anywhere; padding-top: .35rem; }
      .path { color: #777; display: block; font-size: .75rem; }
    </style>
  </head>
  <body>
    <h1>imcluster report</h1>
    <div class="metadata">
      {% for key, value in metadata.items() %}<span><strong>{{ key }}:</strong> {{ value }}</span>{% endfor %}
    </div>
    {% for key, items in data.items() %}
      <details open>
        <summary>{% if key == -1 %}Noise{% else %}Cluster {{ key }}{% endif %} ({{ items|length }})</summary>
        <div class="grid">
          {% for item in items %}
            <figure>
              <img src="data:image/jpeg;base64,{{ item.thumbnail }}" alt="Thumbnail of {{ item.filename }}" loading="lazy">
              <figcaption>{{ item.filename }}<span class="path">{{ item.path }}</span></figcaption>
            </figure>
          {% endfor %}
        </div>
      </details>
    {% endfor %}
  </body>
</html>
